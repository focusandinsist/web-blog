services:
  backend:
    image: web-blog-backend
    env_file: .env
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_MEDIA_ROOT: /app/media
      DJANGO_STATIC_ROOT: /app/staticfiles
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles
  proxy:
    image: nginx:stable-alpine
    depends_on:
      - backend
    ports:
      - "8000:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/srv/media:ro
volumes:
  media:
  staticfiles:
