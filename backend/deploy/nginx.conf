# Mount this as /etc/nginx/conf.d/default.conf in an Nginx container.
# Mount the backend media volume read-only at /srv/media in that container.
server {
    listen 80;
    server_name _;

    location /media/ {
        alias /srv/media/;
        autoindex off;
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
